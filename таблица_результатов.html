let currentTab = 'all';

function renderStats() {
  const active = DATA.filter(d => d.status === 'действующая').length;
  const liq = DATA.filter(d => d.status === 'ликвидирована').length;
  const withPhone = DATA.filter(d => d.phones).length;
  const withEmail = DATA.filter(d => d.email).length;
  const withSite = DATA.filter(d => d.site).length;
  
  document.getElementById('stats').innerHTML = `
    <div class="stat-card green"><div class="num">${active}</div><div class="label">🟢 Действующих</div></div>
    <div class="stat-card red"><div class="num">${liq}</div><div class="label">🔴 Ликвидированных</div></div>
    <div class="stat-card blue"><div class="num">${DATA.length}</div><div class="label">Всего записей</div></div>
    <div class="stat-card orange"><div class="num">${withPhone}</div><div class="label">📞 С телефонами</div></div>
    <div class="stat-card orange"><div class="num">${withEmail}</div><div class="label">📧 С email</div></div>
    <div class="stat-card blue"><div class="num">${withSite}</div><div class="label">🌐 С сайтами</div></div>
  `;
}

function getFilteredData() {
  const search = document.getElementById('search').value.toLowerCase();
  const statusF = document.getElementById('statusFilter').value;
  
  return DATA.filter(d => {
    if (currentTab === 'active' && d.status !== 'действующая') return false;
    if (currentTab === 'liquidated' && d.status !== 'ликвидирована') return false;
    if (currentTab === 'contacts' && !d.phones && !d.email) return false;
    if (currentTab === 'mfg' && !d.mfg) return false;
    if (statusF && d.status !== statusF) return false;
    if (search) {
      const s = `${d.name} ${d.inn} ${d.email} ${d.site} ${d.phones}`.toLowerCase();
      if (!s.includes(search)) return false;
    }
    return true;
  });
}

function renderTable() {
  const filtered = getFilteredData();
  const tbody = document.getElementById('tbody');
  
  document.getElementById('countInfo').textContent = `Показано: ${filtered.length} из ${DATA.length}`;
  
  tbody.innerHTML = filtered.map(d => {
    const statusClass = d.status === 'действующая' ? 'status-active' : 'status-liquidated';
    const statusText = d.status === 'действующая' ? '🟢 Действующая' : '🔴 Ликвидирована';
    const siteLink = d.site ? `<a href="https://${d.site.replace(/^https?:\/\//,'')}" target="_blank">${d.site}</a>` : '—';
    const emailLinks = d.email ? d.email.split(',').map(e => `<a href="mailto:${e.trim()}">${e.trim()}</a>`).join(', ') : '—';
    
    return `<tr>
      <td>${d.n}</td>
      <td><strong>${d.name}</strong>${d.mfg ? ' <span class="badge">🏭 производитель</span>' : ''}</td>
      <td><span class="${statusClass}">${statusText}</span></td>
      <td style="font-family:monospace;font-size:12px">${d.inn || '—'}</td>
      <td style="font-size:12px">${d.phones || '—'}</td>
      <td style="font-size:12px">${emailLinks}</td>
      <td style="font-size:12px">${siteLink}</td>
      <td style="font-size:11px">${d.src}</td>
    </tr>`;
  }).join('');
}

function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  renderTable();
}

function filterTable() { renderTable(); }
function resetFilters() {
  document.getElementById('search').value = '';
  document.getElementById('statusFilter').value = '';
  currentTab = 'all';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.tab').classList.add('active');
  renderTable();
}

renderStats();
renderTable();
